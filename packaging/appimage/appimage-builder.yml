# appimage-builder recipe for BlueP.
#
# Build (inside an Ubuntu container or Ubuntu runner with appimage-builder):
#   appimage-builder --recipe packaging/appimage/appimage-builder.yml --skip-test
#
# Produces: BlueP-<version>-x86_64.AppImage
#
# Python 3.14 is pulled from the deadsnakes PPA (Ubuntu's stock python3 is 3.12).
# The release workflow substitutes __APP_VERSION__ before building.
version: 1

script:
  # Stage the app into AppDir/usr via pip (using deadsnakes python3.14).
  # PyGObject must be built for python3.14 (apt's python3-gi targets system 3.12),
  # so we pip-install pygobject+pycairo first, compiling against the apt dev libs.
  # pygobject is pinned to 3.48.2: pygobject >=3.52 requires girepository-2.0.pc
  # (GLib 2.80+ merged introspection), unavailable on Ubuntu 24.04 LTS.
  - mkdir -p AppDir/usr/lib/python3.14/site-packages AppDir/usr/bin
  - python3.14 -m pip install --ignore-installed --no-cache-dir --target=AppDir/usr/lib/python3.14/site-packages "pygobject==3.48.2" pycairo .
  # Console entry point
  - printf '#!/bin/sh\nexec python3.14 -m bluep "$@"\n' > AppDir/usr/bin/bluep
  - chmod +x AppDir/usr/bin/bluep
  # Desktop integration assets
  - install -Dm644 packaging/assets/io.bluep.BlueP.desktop AppDir/usr/share/applications/io.bluep.BlueP.desktop
  - install -Dm644 packaging/assets/io.bluep.BlueP.metainfo.xml AppDir/usr/share/metainfo/io.bluep.BlueP.metainfo.xml
  - install -Dm644 packaging/assets/io.bluep.BlueP.svg AppDir/usr/share/icons/hicolor/scalable/apps/io.bluep.BlueP.svg

AppDir:
  path: AppDir

  app_info:
    id: io.bluep.BlueP
    name: BlueP
    icon: io.bluep.BlueP
    version: __APP_VERSION__
    exec: usr/bin/bluep
    exec_args: "$@"

  apt:
    arch:
      - amd64
    sources:
      # deadsnakes PPA provides Python 3.14 for Ubuntu LTS.
      - sourceline: 'deb [arch=amd64] http://archive.ubuntu.com/ubuntu noble main universe'
      - sourceline: 'deb [arch=amd64] http://archive.ubuntu.com/ubuntu noble-updates main universe'
      - sourceline: 'deb [arch=amd64] https://ppa.launchpadcontent.net/deadsnakes/ppa/ubuntu noble main'
        key_url: 'https://keyserver.ubuntu.com/pks/lookup?op=get&search=0xF23C5A6CF475977595C89F51BA6932366A755776'
    include:
      # Python 3.14 runtime
      - python3.14
      - python3.14-minimal
      - python3.14-venv
      # PyGObject + GTK4 + GtkSourceView 5 typelibs (system libs bundled into AppDir)
      - python3-gi
      - gir1.2-gtk-4.0
      - gir1.2-gtksourceview-5
      - gir1.2-glib-2.0
      - gir1.2-pango-1.0
      - gir1.2-graphene-1.0
      - libgtk-4-1
      - libgtksourceview-5-0
      - libgirepository-1.0-1
      - libpango-1.0-0
      - libgraphene-1.0-0
      # GTK runtime data
      - libgtk-4-common
      - libgtksourceview-5-common
      - shared-mime-info
      - hicolor-icon-theme
      - adwaita-icon-theme
      - libglib2.0-0
      - libxml2
      - libffi8
      - libgdk-pixbuf-2.0-0
      - glib-networking
      - gsettings-desktop-schemas
      # Build deps for compiling pygobject against python3.14 (pip install pygobject)
      - libgtk-4-dev
      - libgirepository1.0-dev
      - libcairo2-dev
      - pkg-config
      - python3.14-dev

  runtime:
    env:
      # Point the bundled Python at the AppDir site-packages.
      PYTHONHOME: '$APPDIR/usr'
      PYTHONPATH: '$APPDIR/usr/lib/python3.14/site-packages'
      # GObject-introspection typelib search path.
      GI_TYPELIB_PATH: '$APPDIR/usr/lib/girepository-1.0:$APPDIR/usr/lib/x86_64-linux-gnu/girepository-1.0'
      # GLib/GTK runtime paths.
      GIO_MODULE_DIR: '$APPDIR/usr/lib/x86_64-linux-gnu/gio/modules'
      GSETTINGS_SCHEMA_DIR: '$APPDIR/usr/share/glib-2.0/schemas'
      GDK_PIXBUF_MODULEDIR: '$APPDIR/usr/lib/x86_64-linux-gnu/gdk-pixbuf-2.0/2.10.0/loaders'
      GTK_PATH: '$APPDIR/usr'
      XDG_DATA_DIRS: '$APPDIR/usr/share:/usr/share'

  after_bundle:
    # Compile gsettings schemas and update icon/mime caches inside the AppDir.
    - glib-compile-schemas $APPDIR/usr/share/glib-2.0/schemas
    - gtk4-update-icon-cache -f -t $APPDIR/usr/share/icons/hicolor || true
    - update-mime-database $APPDIR/usr/share/mime || true
    - gdk-pixbuf-query-loaders --update-cache || true

